name: Screenshots

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Render screens
        run: |
          for attempt in 1 2 3 4; do
            ./gradlew testDebugUnitTest --tests 'helium314.keyboard.ScreenshotTest' --tests 'helium314.keyboard.KeyboardShotTest' --max-workers=2 && break
            if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then break; fi
            sleep 45
          done
        continue-on-error: true

      - name: Publish screenshots and reports
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view screens >/dev/null 2>&1 || gh release create screens --prerelease --title "Screens" --notes "Rendered screens, replaced on every push."
          mkdir -p app/build/screens
          cp app/build/test-results/testDebugUnitTest/TEST-helium314.keyboard.ScreenshotTest.xml app/build/screens/report.xml || true
          cp app/build/test-results/testDebugUnitTest/TEST-helium314.keyboard.KeyboardShotTest.xml app/build/screens/keyboard-report.xml || true
          ls app/build/screens
          gh release upload screens app/build/screens/* --clobber
