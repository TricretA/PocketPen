name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocketpen-debug
          path: app/build/outputs/apk/debug/*-debug*.apk

      - name: Publish test build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*-debug*.apk | head -n 1)
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$APK" --prerelease --target "$GITHUB_SHA" --title "Pocketpen test build" --notes "Debug build of commit ${GITHUB_SHA::7}. Install over the previous build to update."

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '*/build/reports'
        if: ${{ failure() }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --tests 'helium314.keyboard.ClipboardDaoTest' --tests 'helium314.keyboard.AiClientTest' --tests 'helium314.keyboard.InkJudgeTest'

      - name: Archive test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports'
        if: ${{ failure() }}
