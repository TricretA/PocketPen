name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "Pocketpen-${TAG}.apk"
          sha256sum "Pocketpen-${TAG}.apk" > "Pocketpen-${TAG}.apk.sha256"
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" "Pocketpen-${TAG}.apk" "Pocketpen-${TAG}.apk.sha256" --title "Pocketpen ${TAG#v}" --generate-notes --notes-file CHANGELOG.md
